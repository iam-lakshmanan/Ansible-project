
---
- name: Install and configure Nginx
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: presentsss

      ignore_errors: yes  

    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started

    - name: Enable Nginx on boot
      ansible.builtin.service:
        name: nginx
        enabled: true